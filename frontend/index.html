      position:sticky;

      z-index:2000;

    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .logo{
      width:48px;height:48px;border-radius:13px;

      border:1px solid rgba(86,224,255,.42);

      box-shadow:0 0 24px rgba(86,224,255,.13);

    .yearBox select{
      color:var(--text);background:#081a2b;border:1px solid #245878;
      border-radius:5px;padding:7px 9px;font-size:10px;outline:none;

    .status{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:1px}

    .dashboard{

      padding:10px;

    .col{display:flex;flex-direction:column;gap:10px;min-width:0}

<script type="text/babel">
const {useEffect,useMemo,useRef,useState} = React;

const API = "http://127.0.0.1:8000";

const fallbackStorms = [
  {id:1786,name:"NISARGA",year:2020,basin:"NI - AS",latitude:18.1,longitude:72.9,max_wind:60,min_pressure:984,movement:"NE"},
  {id:0,name:"TAUKTAE",year:2021,basin:"NI - AS",latitude:15.1,longitude:73.2,max_wind:85,min_pressure:950,movement:"N"},
  {id:0,name:"ASANI",year:2022,basin:"NI - BB",latitude:18.2,longitude:85.8,max_wind:60,min_pressure:982,movement:"NNE"}
];

const fallbackTrack = [
  {timestamp:"2020-06-03 00:00",latitude:16.1,longitude:74.1,wind_speed:45,pressure:997},
  {timestamp:"2020-06-03 03:00",latitude:16.7,longitude:73.8,wind_speed:50,pressure:992},
  {timestamp:"2020-06-03 06:00",latitude:17.3,longitude:73.5,wind_speed:55,pressure:988},
  {timestamp:"2020-06-03 09:00",latitude:17.8,longitude:73.2,wind_speed:58,pressure:986},
  {timestamp:"2020-06-03 12:00",latitude:18.1,longitude:72.9,wind_speed:60,pressure:984}
];

function Card({title,icon,children,className=""}){
  return (
    <section className={"card "+className}>
      <div className="cardHead">
        <div className="cardTitle"><span className="icon">{icon}</span>{title}</div>
      </div>
      {children}
    </section>
  );
}

function basinName(basin){
  return (basin || "").includes("AS") ? "Arabian Sea" :
         (basin || "").includes("BB") ? "Bay of Bengal" :
         "North Indian Ocean";
}

function App(){
  const [year,setYear] = useState(2020);
  const [storms,setStorms] = useState(fallbackStorms);
  const [selected,setSelected] = useState(fallbackStorms[0]);
  const [track,setTrack] = useState(fallbackTrack);
  const [ai,setAi] = useState({
    predicted_pattern:"Developing",
    confidence:94,
    class_scores:{
      Developing:94,"Curved Band":3,CDO:2,Sheared:1,"Eye/Eyewall":0,Weakening:0
    },
    current_intensity:"Severe",
    next_6_hours:"Strengthening",
    next_12_hours:"Very Severe"
  });
  const [apiOnline,setApiOnline] = useState(false);
  const [playing,setPlaying] = useState(false);
  const [step,setStep] = useState(0);
  const [trackMode,setTrackMode] = useState(true);
  const [loadingStorms,setLoadingStorms] = useState(false);

  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const layers = useRef({});
  const chartInstance = useRef(null);

  async function loadStorms(selectedYear){
    setLoadingStorms(true);
    try{
      const r = await fetch(`${API}/api/cyclone/historical?year=${selectedYear}&limit=50`);
      if(!r.ok) throw new Error("historical API");
      const data = await r.json();

      const named = data.filter(x => x.name && x.name.toUpperCase() !== "UNNAMED");
      const list = named.length ? named : data;

      setStorms(list.length ? list : fallbackStorms);

      const preferred =
        list.find(x => (x.name || "").toUpperCase() === "NISARGA") ||
        list[0] ||
        fallbackStorms[0];

      setSelected(preferred);
      setApiOnline(true);
    }catch(e){
      console.warn("Historical API unavailable. Using fallback data.", e);
      setApiOnline(false);

      const fallback = fallbackStorms.filter(x => Number(x.year) === Number(selectedYear));
      setStorms(fallback.length ? fallback : fallbackStorms);
      setSelected(fallback.length ? fallback[0] : fallbackStorms[0]);
    }finally{
      setLoadingStorms(false);
    }
  }

  useEffect(()=>{
    loadStorms(year);
  },[year]);

  useEffect(()=>{
    if(!selected) return;

    let alive = true;

    async function loadTrack(){
      try{
        if(!selected.id) throw new Error("No cyclone id");

        const r = await fetch(`${API}/api/cyclone/${selected.id}/track`);
        if(!r.ok) throw new Error("track API");

        const data = await r.json();
        const valid = data.filter(p => p.latitude != null && p.longitude != null);

        if(alive){
          setTrack(valid.length ? valid : fallbackTrack);
          setStep(0);
        }
      }catch(e){
        if(alive){
          setTrack(fallbackTrack);
          setStep(0);
        }
      }
    }

    loadTrack();
    return ()=>{alive=false};
  },[selected]);

  useEffect(()=>{
    async function loadAI(){
      try{
        const r = await fetch(`${API}/api/ai/predict`);
        if(!r.ok) return;

        const d = await r.json();
        if(d.status === "success"){
          setAi(prev => ({...prev,...d}));
        }
      }catch(e){
        console.warn("AI endpoint unavailable; demo prediction retained.");
      }
    }
    loadAI();
  },[selected]);

  // Initialize Leaflet satellite map once.
  useEffect(()=>{
    if(!mapRef.current || leafletMap.current) return;

    const map = L.map(mapRef.current,{
      zoomControl:false,
      attributionControl:true
    }).setView([18,76],5);

    L.control.zoom({position:"bottomright"}).addTo(map);

    leafletMap.current = map;

    layers.current.tiles = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom:17,
        opacity:0.90,
        attribution:"Tiles © Esri"
      }
    ).addTo(map);

    return ()=>{
      if(leafletMap.current){
        leafletMap.current.remove();
        leafletMap.current=null;
      }
    };
  },[]);

  // Update satellite, observed track, cyclone marker and forecast cone.
  useEffect(()=>{
    if(!leafletMap.current || !track.length) return;

    const map = leafletMap.current;

    // Remove old overlays except the base tile layer.
    Object.keys(layers.current).forEach(key=>{
      if(key !== "tiles" && layers.current[key]?.remove){
        layers.current[key].remove();
      }
    });

    if(layers.current.tiles){
      layers.current.tiles.setOpacity(trackMode ? 0.90 : 0.72);
    }

    const pts = track
      .map(p => [Number(p.latitude),Number(p.longitude)])
      .filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));

    if(!pts.length) return;

    // Full historical track.
    layers.current.full = L.polyline(pts,{
      color:"#56e0ff",
      weight:3,
      opacity:trackMode ? 0.36 : 0.18
    }).addTo(map);

    // Observed portion up to current timeline position.
    const observed = pts.slice(0,Math.min(step+1,pts.length));
    if(observed.length > 1){
      layers.current.obs = L.polyline(observed,{
        color:"#67f2c4",
        weight:4,
        opacity:0.95
      }).addTo(map);
    }

    const current = pts[Math.min(step,pts.length-1)];

    layers.current.marker = L.circleMarker(current,{
      radius:9,
      color:"#d9fbff",
      weight:2,
      fillColor:"#56e0ff",
      fillOpacity:.95
    }).addTo(map).bindTooltip(
      `${selected?.name || "CYCLONE"} • ${track[Math.min(step,track.length-1)]?.wind_speed ?? "--"} kt`
    );

    // Prototype forecast cone from recent motion.
    if(pts.length >= 2){
      const p1 = pts[Math.max(0,pts.length-2)];
      const p2 = pts[pts.length-1];

      const dLat = p2[0]-p1[0];
      const dLon = p2[1]-p1[1];
      const end = [p2[0]+dLat*4,p2[1]+dLon*4];
      const left = [
        p2[0]-dLon*1.9+dLat*.4,
        p2[1]+dLat*1.9+dLon*.4
      ];
      const right = [
        p2[0]+dLon*1.9+dLat*.4,
        p2[1]-dLat*1.9+dLon*.4
      ];

      layers.current.cone = L.polygon(
        [left,end,right,p2],
        {
          color:"#ffd36a",
          weight:1,
          dashArray:"5 5",
          fillColor:"#ffd36a",
          fillOpacity: trackMode ? .12 : .05
        }
      ).addTo(map);

      layers.current.forecast = L.polyline(
        [p2,end],
        {
          color:"#ffd36a",
          weight:2,
          dashArray:"7 7",
          opacity:trackMode ? .95 : .45
        }
      ).addTo(map);
    }

    map.setView(current,6,{animate:true,duration:.35});
  },[track,step,trackMode,selected]);

  // Wind/intensity chart.
  useEffect(()=>{
    const canvas = document.getElementById("windChart");
    if(!canvas) return;

    if(chartInstance.current){
      chartInstance.current.destroy();
    }

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0,0,0,170);
    gradient.addColorStop(0,"rgba(86,224,255,.34)");
    gradient.addColorStop(1,"rgba(86,224,255,0)");

    const labels = track.map(p => (p.timestamp || "").substring(11,16) || "--");
    const values = track.map(p => p.wind_speed == null ? null : Number(p.wind_speed));

    chartInstance.current = new Chart(ctx,{
      type:"line",
      data:{
        labels,
        datasets:[{
          data:values,
          borderColor:"#56e0ff",
          backgroundColor:gradient,
          fill:true,
          tension:.35,
          pointRadius:2,
          pointHoverRadius:5,
          borderWidth:2
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{
            ticks:{color:"#789bad",font:{size:8}},
            grid:{color:"rgba(86,224,255,.08)"}
          },
          y:{
            ticks:{color:"#789bad",font:{size:8}},
            grid:{color:"rgba(86,224,255,.08)"}
          }
        }
      }
    });

    return ()=>{
      if(chartInstance.current){
        chartInstance.current.destroy();
        chartInstance.current=null;
      }
    };
  },[track]);

  // Timeline play.
  useEffect(()=>{
    if(!playing) return;

    const timer = setInterval(()=>{
      setStep(s=>{
        if(s >= track.length-1){
          setPlaying(false);
          return s;
        }
        return s+1;
      });
    },850);

    return ()=>clearInterval(timer);
  },[playing,track.length]);

  const current =
    track[Math.min(step,Math.max(0,track.length-1))] ||
    selected ||
    {};

  const scores = ai.class_scores || {};
  const confidence = Math.max(0,Math.min(100,
    Math.round(Number(ai.confidence ?? 94))
  ));

  const displayStorms = storms.slice(0,8);

  function selectStorm(storm){
    setPlaying(false);
    setSelected(storm);
  }

  return (
    <div className="app">
      <header className="header">
        <div className="brand">
          <div className="logo"><span>◉</span></div>
          <div>
            <h1>CycloneAI</h1>
            <small>TROPICAL CYCLONE INTELLIGENCE SYSTEM</small>
          </div>
        </div>

        <div className="headerControls">
          <div className="yearBox">
            <label>YEAR</label>
            <select value={year} onChange={e=>setYear(Number(e.target.value))}>
              {[2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]
                .map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>

          <div className="status">
            <span className="dot"></span>
            <span>AI SYSTEM {apiOnline ? "ONLINE" : "DEMO MODE"}</span>
            <span className="live">LIVE</span>
          </div>
        </div>
      </header>

      <main className="dashboard">

        {/* LEFT */}
        <div className="col left">

          <Card title="STORMS IN SELECTED YEAR" icon="◈">
            <div className="cardBody">
              {loadingStorms ? (
                <div className="loading">Loading storms...</div>
              ) : displayStorms.length ? (
                displayStorms.map((s,i)=>(
                  <div
                    key={(s.id || s.name || "storm")+i}
                    className={"storm "+(selected?.id===s.id ? "active":"")}
                    onClick={()=>selectStorm(s)}
                  >
                    <div className="stormTop">
                      <span className="stormName">{s.name || "UNNAMED"}</span>
                      <span className="stormStatus">
                        {i===0 ? "SELECTED" : "HISTORICAL"}
                      </span>
                    </div>
                    <div className="stormSub">{basinName(s.basin)} • {s.category || "Storm"}</div>
                    <div className="stormWind">Max wind: {s.max_wind ?? "--"} kt</div>
                  </div>
                ))
              ) : (
                <div className="loading">No storms found.</div>
              )}
            </div>
          </Card>

          <Card title="SATELLITE DATA" icon="✦">
            <div className="cardBody">
              {[
                "INSAT-3D / 3DR",
                "HIMAWARI-8 / 9",
                "GPM / IMERG",
                "IMD BEST TRACK",
                "NOAA IBTrACS"
              ].map(x=>(
                <div className="source" key={x}><i></i>{x}</div>
              ))}
            </div>
          </Card>

          <Card title="AI PERFORMANCE" icon="✦">
            <div className="performance">
              <div className="big">{confidence}%</div>
              <div className="perfLabel">PATTERN CONFIDENCE</div>
            </div>
          </Card>

          <Card title="SYSTEM STATUS" icon="◈">
            <div className="cardBody">
              <div className="miniGrid">
                <div className="pill">Backend<br /><b>{apiOnline?"ONLINE":"DEMO"}</b></div>
                <div className="pill">Database<br /><b>IBTrACS</b></div>
                <div className="pill">Vision<br /><b>CNN</b></div>
                <div className="pill">Forecast<br /><b>6–24 H</b></div>
              </div>
            </div>
          </Card>
        </div>

        {/* CENTER */}
        <div className="col center">

          <Card title="SATELLITE & TRACK OVERLAY" icon="✣" className="mapCard">

            <div className="mapHeaderRow">
              <div className="mapSub">
                {selected?.name || "CYCLONE"} • {selected?.year || year}
                &nbsp; | &nbsp; HIMAWARI / SATELLITE VIEW
              </div>

              <div className="mapToolbar">
                <button
                  className={"toolBtn "+(trackMode ? "active":"")}
                  onClick={()=>setTrackMode(true)}
                >
                  SATELLITE
                </button>
                <button
                  className={"toolBtn "+(!trackMode ? "active":"")}
                  onClick={()=>setTrackMode(false)}
                >
                  TRACK
                </button>
              </div>
            </div>

            <div className="mapWrap">
              <div id="map" ref={mapRef}></div>

              <div className="mapOverlay">
                <div className="overlayLabel">CYCLONE CENTER</div>
                <div className="overlayValue">
                  {Number(current.latitude ?? selected?.latitude ?? 0).toFixed(1)}° N,
                  &nbsp;
                  {Number(current.longitude ?? selected?.longitude ?? 0).toFixed(1)}° E
                </div>
                <div className="overlaySmall">
                  {current.timestamp || "Track time unavailable"}
                </div>
              </div>

              <div className="mapLegend">
                <div className="legendRow"><span className="legendLine"></span> Observed track</div>
                <div className="legendRow"><span className="legendLine legendForecast"></span> AI forecast</div>
                <div className="legendRow"><span className="legendCone"></span> Uncertainty cone</div>
              </div>
            </div>

            <div className="timeline">
              <button
                className="play"
                onClick={()=>setPlaying(p=>!p)}
                title={playing ? "Pause" : "Play timeline"}
              >
                {playing ? "Ⅱ" : "▶"}
              </button>

              <input
                className="range"
                type="range"
                min="0"
                max={Math.max(0,track.length-1)}
                value={Math.min(step,Math.max(0,track.length-1))}
                onChange={e=>{
                  setPlaying(false);
                  setStep(Number(e.target.value));
                }}
              />

              <span className="timeText">
                {current.timestamp || "—"} &nbsp; {Math.min(step+1,Math.max(track.length,1))}/{Math.max(track.length,1)}
              </span>
            </div>

            <div className="centerInfo">
              <div className="infoBox">
                <div className="infoLabel">WIND SPEED</div>
                <div className="infoVal">
                  {current.wind_speed ?? selected?.max_wind ?? "—"}
                  <span className="metricUnit">kt</span>
                </div>
              </div>

              <div className="infoBox">
                <div className="infoLabel">PRESSURE</div>
                <div className="infoVal">
                  {current.pressure ?? selected?.min_pressure ?? "—"}
                  <span className="metricUnit">hPa</span>
                </div>
              </div>

              <div className="infoBox">
                <div className="infoLabel">LATITUDE</div>
                <div className="infoVal">
                  {Number(current.latitude ?? selected?.latitude ?? 0).toFixed(1)}
                  <span className="metricUnit">°N</span>
                </div>
              </div>

              <div className="infoBox">
                <div className="infoLabel">LONGITUDE</div>
                <div className="infoVal">
                  {Number(current.longitude ?? selected?.longitude ?? 0).toFixed(1)}
                  <span className="metricUnit">°E</span>
                </div>
              </div>

              <div className="infoBox">
                <div className="infoLabel">MOVEMENT</div>
                <div className="infoVal">{selected?.movement || "NE"}</div>
              </div>
            </div>
          </Card>

          <Card title="INTENSITY TREND" icon="⌁">
            <div className="chartWrap">
              <canvas id="windChart"></canvas>
            </div>
          </Card>

        </div>

        {/* RIGHT */}
        <div className="col right">

          <Card title="AI ANALYSIS" icon="◉">
            <div className="aiBox">
              <div className="aiLabel">PREDICTED PATTERN</div>
              <div className="aiPattern">{ai.predicted_pattern || "Developing"}</div>
              <div className="confTrack">
                <div className="confFill" style={{width:confidence+"%"}}></div>
              </div>
              <div className="confText">Confidence: {confidence}%</div>
            </div>
          </Card>

          <Card title="PATTERN CLASSIFICATION" icon="♨">
            <div className="cardBody">
              {["Developing","Curved Band","CDO","Sheared","Eye/Eyewall","Weakening"].map(x=>(
                <div className="scoreRow" key={x}>
                  <span>{x}</span>
                  <span className="scoreVal">{Math.round(Number(scores[x] || 0))}%</span>
                </div>
              ))}
            </div>
          </Card>

          <Card title="AI PREDICTION" icon="⌁">
            <div className="cardBody">
              <div className="predictRow">
                <span>Current Intensity</span>
                <b>{ai.current_intensity || "Severe"}</b>
              </div>
              <div className="predictRow">
                <span>Next 6 Hours</span>
                <b>{ai.next_6_hours || "Strengthening"}</b>
              </div>
              <div className="predictRow">
                <span>Next 12 Hours</span>
                <b>{ai.next_12_hours || "Very Severe"}</b>
              </div>
              <div className="predictRow">
                <span>AI Model</span>
                <b>CNN + ConvLSTM</b>
              </div>
            </div>
          </Card>

          <div className="card">
            <div className="alert">
              <b>⚠ ADVISORY</b><br />
              Forecast cone is currently a prototype derived from recent track motion.
              Replace it with the trained ConvLSTM trajectory model when the prediction
              pipeline is connected.
            </div>
          </div>

        </div>
      </main>

      <footer className="footer">
        CYCLONEAI • AI-POWERED TROPICAL CYCLONE INTELLIGENCE • REACT + FASTAPI + LEAFLET • SIH PROTOTYPE
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
